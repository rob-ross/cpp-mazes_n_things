name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac ARM Apple Clang 17
            cc: clang
            cxx: clang++
          - name: Mac ARM Homebrew GCC 14
            cc: gcc-14
            cxx: g++-14

    name: Build (${{ matrix.name }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        if: matrix.cc == 'gcc-14'
        run: brew install gcc

      - name: Install ncurses build tools
        run: brew install ncurses pkgconf

      - name: Check compiler and tool versions
        run: |
          uname -m
          cmake --version
          xcode-select -p
          "$CC" --version
          "$CXX" --version
          if [[ "$CC" == "clang" ]]; then
            xcodebuild -version
          fi

      - name: Check GCC ASan runtime
        if: matrix.cc == 'gcc-14'
        run: g++-14 -print-file-name=libasan.dylib

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
